    post:
      operationId: testCommitMessage
      summary: Which tickets a commit message names (admin only)
      description: The "Try a commit message" tester; it reads the message the way the connector does.
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitTestInput" }
      responses:
        "200":
          description: The tickets the message names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitTest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /integrations/events:
    get:
      operationId: listCodeEvents
      summary: What recent code events did, newest first (admin only)
      tags: [integrations]
      responses:
        "200":
          description: Recent events, ignored keys included
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: "#/components/schemas/CodeEventLog" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /repositories:
    post:
      operationId: createRepository
      summary: Connect a repository (admin only)
      description: |
        Returns the webhook secret once; it is stored encrypted and never shown again (make a new
        one instead). Linking a project moves it from any other repository. Error codes are
        `invalid_repository_url`, `repository_taken` (409) and `invalid_project`.
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryCreate" }
      responses:
        "201":
          description: Connected; set the webhook up with the secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryWithSecret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /repositories/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    patch:
      operationId: updateRepository
      summary: Change which projects read commits from a repository (admin only)
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRepository
      summary: Disconnect a repository (admin only)
      description: |
        Its webhooks are refused from then on. A repository with code events is hidden, so tickets
        keep their code activity; one without is deleted.
      tags: [integrations]
      responses:
        "204":
          description: Disconnected
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /repositories/{repositoryId}/secret:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      operationId: rotateRepositorySecret
      summary: Make a new webhook secret (admin only)
      description: The old secret stops working at once; paste the new one into the webhook settings.
      tags: [integrations]
      responses:
        "200":
          description: The new secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryWithSecret" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    post:
      operationId: receiveWebhook
      summary: A webhook delivery from GitHub or GitLab
      description: |
        Public: the repository's secret authenticates it (GitHub signs the body with
        `X-Hub-Signature-256`; GitLab sends `X-Gitlab-Token`). The body is read as sent, JSON or
        GitHub's form encoding, up to 5 MiB, and processed in the background. Only pushes are
        read; a redelivery, a ping or any other event is acknowledged and changes nothing. Error
        codes are `invalid_signature` (401), `repository_mismatch` (409, the webhook was added to
        another repository), `invalid_request` (unreadable payload) and `request_too_large`
        (413); each is shown on the Integrations page.
      tags: [integrations]
      security: []
      x-raw-body: true
      parameters:
        - { name: X-GitHub-Event, in: header, required: false, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: false, schema: { type: string } }
        - { name: X-Hub-Signature-256, in: header, required: false, schema: { type: string } }
        - { name: X-Gitlab-Event, in: header, required: false, schema: { type: string } }
        - { name: X-Gitlab-Token, in: header, required: false, schema: { type: string } }
        - { name: X-Gitlab-Event-UUID, in: header, required: false, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Received before, a ping, or an event the connector doesn't read
        "202":
          description: Stored; processed in the background
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /uat-requests:
    get:
      operationId: listUatRequests
      summary: Tests waiting on the signed-in requester (client staff)
      description: Their client's tickets In UAT that they reported or follow, oldest first.
      tags: [tickets]
      responses:
        "200":
          description: The waiting tests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UatRequest" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /board:
    get:
      operationId: getBoard
      summary: The agent board (staff)
      description: |
        Five columns, left to right: new (new and assigned), in progress, waiting on client,
        in UAT, and resolved since local midnight in the organisation's time zone. Closed
        tickets are off the board. Each column holds at most 100 cards, P1 first, then the
        longest in the column, and reports its full size in `total`. Agents see the tickets
        of their assigned clients; supervisors and admins every ticket. The stats ignore
        `assignee`, `q` and `sla`.
      tags: [tickets]
      parameters:
        - name: assignee
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TicketAssigneeFilter" }
        - name: sla
          in: query
          required: false
          description: "`at_risk`: only open tickets with a clock at risk or breached."
          schema: { $ref: "#/components/schemas/BoardSlaFilter" }
        - name: q
          in: query
          required: false
          description: A ticket key, or words in the subject or client name.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets:
    get:
      operationId: listTickets
      summary: Tickets the user may see, newest first
      description: |
        Requesters see their client's tickets; agents the tickets of their assigned clients;
        supervisors and admins every ticket. Page with `before` = the last id of the previous page.
      tags: [tickets]
      parameters:
        - name: status
          in: query
          required: false
          description: Any of these statuses; all when left out.
          schema:
            type: array
            maxItems: 7
            items: { $ref: "#/components/schemas/TicketStatus" }
        - name: clientId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: assignee
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TicketAssigneeFilter" }
        - name: q
          in: query
          required: false
          description: A ticket key, or words in the subject or client name.
          schema: { type: string, maxLength: 100 }
        - name: before
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: Open a ticket
      description: |
        Requesters report for themselves (channel `portal`); the staff-only fields are ignored.
        Staff log a ticket for a client's requester and must give `clientId`, `requesterId` and a
        non-portal `channel`. Incidents name one of the client's active projects (`projectId`);
        service requests go to the client's default project. The ticket keeps a copy of that
        project's SLA. Error codes are `invalid_subject`, `invalid_description`,
        `invalid_project`, `invalid_catalog_item`, `client_has_no_project`, `client_required`,
        `client_not_found`, `invalid_requester`, `invalid_channel`, `invalid_assignee`,
        `invalid_attachment` and `too_many_attachments`.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getTicket
      summary: One ticket
      description: |
        404 when the user may not see it. A ticket of another organization the user works in
        answers `other_organization` (409) with that organization's id as `detail`, so the app
        can offer to switch (every operation on a ticket key does the same).
      tags: [tickets]
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/messages:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketMessages
      summary: The ticket's conversation, oldest first
      description: Requesters get public messages only.
      tags: [tickets]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketMessage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicketMessage
      summary: Reply, or add an internal note (staff)
      description: |
        A requester asking for `internal` gets 403. Error codes are `invalid_message`,
        `invalid_attachment`, `too_many_attachments` and `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketMessageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/status:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketStatus
      summary: Move the ticket (staff)
      description: |
        Only the moves in the ticket's `allowedStatuses`; otherwise `invalid_status_change` or `ticket_closed` (409). With `from`, a ticket whose status is no longer `from` is left alone and the call fails with `status_changed` (409).
        Resolving a ticket whose Definition of Done isn't met needs a `reason` (`dod_unmet`, 409); it goes to the audit log and the supervisors, never to the client.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketStatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/assignee:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketAssignee
      summary: Assign or unassign the ticket (staff)
      description: Error codes are `invalid_assignee` and `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketAssigneeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/dod:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketDod
      summary: Give the ticket its own Definition of Done, or return it to the project's (staff)
      description: |
        Agents may when the project allows it (`dod_override_not_allowed`, 403); supervisors and
        admins always may. A ticket's own Definition of Done needs a reason (`reason_required`),
        which goes to the audit log. `null` returns the ticket to the project's.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketDodInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/priority:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketPriority
      summary: Change the priority, with a reason (staff)
      description: The reason goes to the audit log. Error codes are `reason_required` and `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPriorityInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/activity:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketActivity
      summary: The ticket's activity log, oldest first (staff)
      tags: [tickets]
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketActivity" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/code:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getTicketCode
      summary: The ticket's code activity, newest first (staff)
      description: |
        Pull/merge requests (one per number, in their latest state) and commits that named the
        ticket. Commit messages are internal, so client staff get 404.
      tags: [tickets]
      responses:
        "200":
          description: Code activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCode" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/uat:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: answerTicketUat
      summary: Approve or reject the fix while the ticket waits In UAT (client staff)
      description: |
        Any requester of the ticket's client may answer. Approval resolves the ticket; a rejection
        needs a `message` (`invalid_message`), posted as a public reply, and hands the ticket back to
        the team. A ticket no longer In UAT fails with `uat_not_waiting` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UatAnswerInput" }
      responses:
        "200":
          description: Answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/reopen:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: reopenTicket
      summary: Reopen a resolved ticket while its reopen window lasts (client staff)
      description: |
        Any requester of the ticket's client may reopen it, within 3 working days of its
        resolution; it goes back to the team with the same priority. Otherwise
        `reopen_not_allowed`, or `ticket_closed` once closed (409).
      tags: [tickets]
      responses:
        "200":
          description: Reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/watchers:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketWatchers
      summary: Colleagues following the ticket ("People notified", besides the requester)
      tags: [tickets]
      responses:
        "200":
          description: Watchers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Colleague" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addTicketWatcher
      summary: Add a colleague to the ticket (requesters)
      description: |
        The colleague must be another active or invited requester of the ticket's client;
        otherwise `invalid_watcher`. Adding someone already following changes nothing. Staff get
        403; a closed ticket gives `ticket_closed` (409). Returns the updated list.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatcherInput" }
      responses:
        "200":
          description: Watchers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Colleague" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/watchers/{userId}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeTicketWatcher
      summary: Take a colleague off the ticket (requesters)
      description: Staff get 403; a closed ticket gives `ticket_closed` (409); someone not following gives 404.
      tags: [tickets]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/watcher-candidates:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketWatcherCandidates
      summary: The client's other requesters who could follow the ticket (requesters)
      description: At most 20, by name; `q` narrows by name. Staff get 403.
      tags: [tickets]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Colleague" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notifications:
    get:
      operationId: listNotifications
      summary: The user's inbox, newest first
      description: |
        Only notifications about tickets the user can still see. Page with `before` (the last
        id of the previous page); `nextBefore` is null on the last page.
      tags: [notifications]
      parameters:
        - name: filter
          in: query
          schema: { $ref: "#/components/schemas/NotificationFilter" }
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Inbox page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: How many inbox items are unread (the bell's count)
      tags: [notifications]
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every inbox item read
      tags: [notifications]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    put:
      operationId: setNotificationRead
      summary: Mark one inbox item read or unread
      description: Another user's notification gives 404.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReadInput" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notification-settings:
    get:
      operationId: getNotificationSettings
      summary: The user's notification switches and email timing
      tags: [notifications]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notification-settings/events/{event}:
    parameters:
      - name: event
        in: path
        required: true
        schema: { $ref: "#/components/schemas/NotificationEvent" }
    put:
      operationId: setNotificationPreference
      summary: Switch one event's web and email notifications
      description: |
        An event the user's settings don't list gives `notification_event_unknown`; switching off
        an always-on event gives `notification_locked`.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferenceInput" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /notification-settings/email-frequency:
    put:
      operationId: setEmailFrequency
      summary: Choose when notification emails go out
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailFrequencyInput" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /attachments:
    post:
      operationId: uploadAttachment
      summary: Upload one file
      description: |
        The file waits, unlinked, until a new ticket or message names it in `attachmentIds`; unlinked
        files are deleted after 24 hours. Error codes are `attachment_too_large` (413),
        `attachment_type_not_allowed`, `attachment_empty`, `invalid_attachment` and
        `too_many_pending_attachments` (409).
      tags: [attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: downloadAttachment
      summary: Download a file on a ticket the user may see
      description: Always served as a download. Files on internal notes are hidden from requesters (404).
      tags: [attachments]
      responses:
        "200":
          description: The file
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Content-Security-Policy:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /reports/sla:
    get:
      operationId: getSlaReport
      summary: The monthly SLA report for every client (supervisors and admins)
      description: |
        A month holds the tickets created in it, in the organisation's time zone, open or done.
        A ticket is within SLA while neither of its clocks has breached; breaches count tickets,
        not clocks. Every client is listed, busiest first, clients without tickets last.
        Error code `month_in_future` (400).
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/ReportMonth"
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /reports/sla/excel:
    get:
      operationId: exportSlaReportExcel
      summary: The monthly SLA report for every client as an Excel file (supervisors and admins)
      description: |
        A Summary sheet with the report's figures and a Tickets sheet with one row per ticket.
        Times are written in the organisation's time zone, named in the headers. Error code
        `month_in_future` (400).
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/ReportMonth"
      responses:
        "200":
          description: The workbook
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Content-Security-Policy:
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /reports/sla/clients/{clientId}/pdf:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: exportSlaReportPdf
      summary: One client's monthly SLA report as a PDF (supervisors and admins)
      description: |
        The client's figures, a row per project and every ticket of the month, to send to that
        client; it never shows another client's numbers. A plain export, not signed. Error code
        `month_in_future` (400).
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/ReportMonth"
      responses:
        "200":
          description: The PDF
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Content-Security-Policy:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sd_session
      description: "`__Host-sd_session` when served over HTTPS."

  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketKey:
      name: ticketKey
      in: path
      required: true
      description: A ticket key such as HD-24871 (case-insensitive).
      schema: { type: string, maxLength: 30, pattern: "^[A-Za-z][A-Za-z0-9]{0,9}-[0-9]{1,18}$" }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CatalogItemId:
      name: catalogItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportMonth:
      name: month
      in: query
      required: false
      description: A month such as `2026-11`; the current month when left out.
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Unauthorized }
        status: { type: integer, example: 401 }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable error code, e.g. `invalid_credentials`.
          example: invalid_credentials
        requestId: { type: string }
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Role:
      type: string
      enum: [admin, supervisor, agent, requester]

    UserStatus:
      type: string
      enum: [active, invited, suspended]

    ClientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Install:
      type: object
      required: [setupRequired, appUrl]
      properties:
        setupRequired:
          type: boolean
          description: First-run setup is still open (no administrator yet).
        appUrl:
          type: string
          description: Where emails link to; set by the APP_URL environment variable on the server.

    OrganizationSummary:
      type: object
      required: [id, name, ticketPrefix, timezone, logoUrl, memberCount, clientCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: PT Mitra Data }
        ticketPrefix: { type: string, example: MD }
        timezone: { type: string, example: Asia/Makassar }
        logoUrl: { type: string, nullable: true }
        memberCount: { type: integer, description: Supervisors and agents (administrators work everywhere). }
        clientCount: { type: integer }

    Organization:
      type: object
      required: [id, name, timezone, ticketPrefix, appUrl, logoUrl, footerNote]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Demo Vendor }
        timezone:
          type: string
          description: IANA time zone; times are shown in it.
          example: Asia/Jakarta
        ticketPrefix: { type: string, example: HD }
        appUrl:
          type: string
          description: Where emails link to; set by the APP_URL environment variable on the server.
          example: https://helpdesk.example.co.id
        logoUrl:
          type: string
          nullable: true
          description: The logo's versioned URL, relative to the site; null without a logo.
        footerNote:
          type: string
          nullable: true
          example: Data stored in Indonesia · Personal data handled under UU PDP

    OrganizationInput:
      type: object
      required: [name, ticketPrefix, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        ticketPrefix:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9]{0,9}$"
          description: Upper-cased when saved.
        timezone: { type: string, minLength: 1, maxLength: 64, example: Asia/Jakarta }

    Me:
      type: object
      required: [id, email, name, role, isAdmin, organization, organizations]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          nullable: true
          description: |
            The role in `organization`. Null for staff who belong to no organization yet: they can
            only wait to be added to one.
        isAdmin:
          type: boolean
          description: An administrator of the install, working in every organization.
        organization:
          allOf: [{ $ref: "#/components/schemas/OrganizationChoice" }]
          nullable: true
          description: |
            The organization this request works in: the one `X-Organization-Id` names, else the
            user's last one. Requesters always work in their client's.
        organizations:
          type: array
          description: The organizations the user can work in, by name (every one for administrators).
          items: { $ref: "#/components/schemas/OrganizationChoice" }
        jobTitle: { type: string, nullable: true, example: L2 }
        client:
          allOf: [{ $ref: "#/components/schemas/ClientRef" }]
          nullable: true
          description: Set for requesters only.

    OrganizationChoice:
      type: object
      required: [id, name, role, logoUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: PT Vendor Teknologi }
        role: { $ref: "#/components/schemas/Role" }
        logoUrl:
          type: string
          nullable: true
          description: The organization's logo, versioned (see `GET /organizations/{organizationId}/logo`).

    User:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        jobTitle: { type: string, nullable: true }
        client:
          allOf: [{ $ref: "#/components/schemas/ClientRef" }]
          nullable: true
        lastLoginAt: { type: string, format: date-time, nullable: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 10 to 128 characters.

    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    GitProvider:
      type: string
      enum: [github, gitlab]

    RepositoryRef:
      type: object
      required: [id, provider, fullName, webUrl]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/GitProvider" }
        fullName: { type: string, example: vendor-id/eoffice-jambi }
        webUrl: { type: string, example: "https://github.com/vendor-id/eoffice-jambi" }

    RepositoryStatus:
      type: string
      description: |
        `waiting`: no verified delivery yet. `connected`: the latest delivery was accepted.
        `failing`: the latest delivery was refused (see `lastError`).
      enum: [waiting, connected, failing]

    RepositoryError:
      type: string
      description: |
        Why the latest delivery was refused: `bad_signature` (missing or wrong secret),
        `repository_mismatch` (the webhook belongs to another repository), `malformed` (unreadable
        payload), `too_large`.
      enum: [bad_signature, repository_mismatch, malformed, too_large]

    LinkedProject:
      type: object
      required: [id, name, client]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        client: { $ref: "#/components/schemas/Ref" }

    Repository:
      type: object
      required: [id, provider, host, fullName, webUrl, webhookUrl, status, lastDeliveryAt, lastError, lastErrorAt,
                 projects]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/GitProvider" }
        host: { type: string, example: gitlab.vendor.co.id }
        fullName: { type: string, example: gov/sipd-connector }
        webUrl: { type: string }
        webhookUrl:
          type: string
          description: Where the provider sends webhooks, built from the App URL.
        status: { $ref: "#/components/schemas/RepositoryStatus" }
        lastDeliveryAt: { type: string, format: date-time, nullable: true }
        lastError:
          allOf: [{ $ref: "#/components/schemas/RepositoryError" }]
          nullable: true
        lastErrorAt: { type: string, format: date-time, nullable: true }
        projects:
          type: array
          items: { $ref: "#/components/schemas/LinkedProject" }

    RepositoryWithSecret:
      type: object
      required: [repository, secret]
      properties:
        repository: { $ref: "#/components/schemas/Repository" }
        secret:
          type: string
          description: The webhook secret (GitHub) or secret token (GitLab). Shown only now.

    RepositoryCreate:
      type: object
      required: [provider, url, projectIds]
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        url:
          type: string
          maxLength: 600
          description: The repository's web address, e.g. https://github.com/vendor-id/eoffice-jambi.
        projectIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }

    RepositoryUpdate:
      type: object
      required: [projectIds]
      properties:
        projectIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }

    Integrations:
      type: object
      required: [repositories, ticketPrefix]
      properties:
        repositories:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
        ticketPrefix:
          type: string
          description: The prefix new ticket keys get, for the commit message examples.
          example: HD

    Priority:
      type: string
      enum: [P1, P2, P3, P4]

    SlaCalendar:
      type: string
      description: "`business_hours` counts working minutes only; `always` runs 24/7."
      enum: [business_hours, always]

    Weekday:
      type: string
      enum: [sun, mon, tue, wed, thu, fri, sat]

    Client:
      type: object
      required: [id, name, contractNo, contractStart, contractEnd, picName, picEmail, projects,
                 requesterCount, agents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Dinas Kominfo Jambi }
        contractNo: { type: string, nullable: true, example: KTR/KOMINFO-JMB/006/2026 }
        contractStart: { type: string, format: date, nullable: true }
        contractEnd: { type: string, format: date, nullable: true }
        picName: { type: string, nullable: true }
        picEmail: { type: string, nullable: true }
        projects:
          type: array
          description: The client's projects, by name.
          items: { $ref: "#/components/schemas/Ref" }
        requesterCount: { type: integer }
        agents:
          type: array
          description: Agents assigned to this client, by name.
          items: { $ref: "#/components/schemas/Ref" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClientInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        contractNo: { type: string, nullable: true, maxLength: 100 }
        contractStart: { type: string, format: date, nullable: true }
        contractEnd: { type: string, format: date, nullable: true }
        picName: { type: string, nullable: true, maxLength: 200 }
        picEmail: { type: string, nullable: true, maxLength: 254 }

    ClientAgentsInput:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }

    PriorityLevel:
      type: object
      required: [code, name, description]
      properties:
        code: { $ref: "#/components/schemas/Priority" }
        name: { type: string, minLength: 1, maxLength: 40, example: Critical }
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: A public service or the whole office is down

    DurationUnit:
      type: string
      description: "`min` minutes, `h` hours, `wd` working days (one business-hours window), `d` calendar days."
      enum: [min, h, wd, d]

    Duration:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer, minimum: 1, maximum: 525600 }
        unit: { $ref: "#/components/schemas/DurationUnit" }

    ProjectTarget:
      type: object
      required: [priority, firstResponse, resolve, deliver, calendar]
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        firstResponse: { $ref: "#/components/schemas/Duration" }
        resolve:
          description: Incidents.
          allOf: [{ $ref: "#/components/schemas/Duration" }]
        deliver:
          description: Service requests.
          allOf: [{ $ref: "#/components/schemas/Duration" }]
        calendar: { $ref: "#/components/schemas/SlaCalendar" }

    AtRiskPercent:
      type: integer
      description: Share of a target that may pass before a ticket counts as at risk.
      enum: [50, 75, 90]

    ProjectSla:
      type: object
      required: [targets, pauseOnWaitingClient, pauseOnUat, atRiskPercent, notifySupervisorOnBreach, notifyPicOnP1Breach]
      properties:
        targets:
          type: array
          description: One per priority, P1 to P4.
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/ProjectTarget" }
        pauseOnWaitingClient: { type: boolean }
        pauseOnUat: { type: boolean }
        atRiskPercent: { $ref: "#/components/schemas/AtRiskPercent" }
        notifySupervisorOnBreach: { type: boolean }
        notifyPicOnP1Breach: { type: boolean }


    AutoApproveDays:
      type: integer
      description: Working days a ticket waits In UAT before the test is approved automatically; 0 never.
      enum: [0, 3, 5]


    DodUat:
      type: object
      required: [enabled, autoApproveWorkingDays]
      properties:
        enabled: { type: boolean }
        autoApproveWorkingDays: { $ref: "#/components/schemas/AutoApproveDays" }

    DodConfig:
      type: object
      description: |
        A Definition of Done: every enabled condition must be met before a ticket counts as done.
        Both are the client's check: the ticket waits In UAT and one answer meets both. The day
        count is kept while UAT is off. Git never ticks them.
      required: [uat, requesterConfirms]
      properties:
        uat: { $ref: "#/components/schemas/DodUat" }
        requesterConfirms:
          type: boolean
          description: For support work with no code; assumed after 3 working days without an answer.

    ProjectDodInput:
      type: object
      required: [dod, allowTicketOverride]
      properties:
        dod: { $ref: "#/components/schemas/DodConfig" }
        allowTicketOverride:
          type: boolean
          description: Lets agents set a different Definition of Done on one ticket, with a reason.

    Project:
      type: object
      required: [id, client, name, description, isDefault, active, sla, dod, allowTicketOverride,
                 repository, openTicketCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: "#/components/schemas/Ref" }
        name: { type: string, example: e-Office }
        description:
          type: string
          nullable: true
          description: Shown under the name in the portal's "Which system?".
          example: Letters, dispositions, archives
        isDefault:
          type: boolean
          description: Service requests from this client go to its default project.
        active:
          type: boolean
          description: Hidden projects keep their tickets but are left off the report form.
        sla: { $ref: "#/components/schemas/ProjectSla" }
        dod: { $ref: "#/components/schemas/DodConfig" }
        allowTicketOverride:
          type: boolean
          description: Agents may set a different Definition of Done on one ticket, with a reason.
        repository:
          allOf: [{ $ref: "#/components/schemas/RepositoryRef" }]
          nullable: true
          description: Where its tickets' commits are read from.
        openTicketCount:
          type: integer
          description: Tickets not yet resolved or closed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [clientId, name, isDefault, active]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        isDefault: { type: boolean }
        active: { type: boolean }

    ProjectUpdate:
      type: object
      required: [name, isDefault, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        isDefault: { type: boolean }
        active: { type: boolean }

    BusinessHours:
      type: object
      required: [timezone, weekdays, opens, closes, workingDayMinutes]
      properties:
        timezone: { type: string, example: Asia/Jakarta }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/Weekday" }
        opens: { type: string, example: "08:00" }
        closes: { type: string, example: "17:00" }
        workingDayMinutes:
          type: integer
          description: Length of one working day; converts "working days" to minutes.
          example: 540

    BusinessHoursInput:
      type: object
      required: [weekdays, opens, closes]
      properties:
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: "#/components/schemas/Weekday" }
        opens: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "08:00" }
        closes: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", example: "17:00" }

    Holiday:
      type: object
      required: [id, date, name]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        name: { type: string, example: Hari Lahir Pancasila }

    HolidayInput:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 200 }

    HolidayPreset:
      type: object
      required: [year, country, holidayCount, missingCount]
      properties:
        year: { type: integer }
        country: { type: string, example: ID }
        holidayCount: { type: integer }
        missingCount:
          type: integer
          description: Preset dates that have no holiday yet.

    HolidayPresetLoadResult:
      type: object
      required: [year, addedCount, skippedCount]
      properties:
        year: { type: integer }
        addedCount: { type: integer }
        skippedCount:
          type: integer
          description: Dates that already had a holiday.

    NotificationEvent:
      type: string
      description: |
        Team events: comment, internal_note, status, assignment, priority, sla, uat_result, dod
        (supervisors; always on, not listed), code (commits that name the ticket).
        Portal events: reply, status, uat_requested (always on), question, resolved, colleague,
        ticket_logged (always on, not listed).
      enum: [comment, internal_note, status, assignment, priority, sla, uat_result, dod, code, reply, question,
             resolved, colleague, ticket_logged, uat_requested]

    NotificationKind:
      type: string
      description: |
        Tells apart notifications of one event: assigned or unassigned; what a colleague did; SLA
        at risk or breached; the test approved, rejected or approved automatically; resolved
        without the Definition of Done, or a ticket given its own.
      enum: [assigned, unassigned, reply, status, added, at_risk, breached, approved, rejected, auto_approved, skipped,
             override]

    NotificationFilter:
      type: string
      description: "`comments` = replies and internal notes (team); `replies` = replies and questions (portal); `status` includes resolved and closed; `code` = code activity (team)."
      enum: [all, unread, comments, status, assigned, sla, replies, code]

    NotificationChange:
      type: string
      enum: [created, message, status, assignee, priority, watcher_added, watcher_removed, sla_at_risk, sla_breached,
             dod, code]

    Audience:
      type: string
      enum: [team, portal]

    SlaClockName:
      type: string
      description: Which SLA clock a notification is about.
      enum: [first_response, resolution]

    EmailFrequency:
      type: string
      description: "`instant` sends one email per change (grouped over about 2 minutes); summaries still send urgent items (P1, SLA) right away."
      enum: [instant, hourly, daily]

    NotificationTicket:
      type: object
      required: [key, subject]
      properties:
        key: { type: string, example: HD-24871 }
        subject: { type: string }

    NotificationAlso:
      type: object
      required: [change, statusFrom, statusTo, priorityFrom, priorityTo, assigneeName, code]
      properties:
        change: { $ref: "#/components/schemas/NotificationChange" }
        statusFrom: { allOf: [{ $ref: "#/components/schemas/TicketStatus" }], nullable: true }
        statusTo: { allOf: [{ $ref: "#/components/schemas/TicketStatus" }], nullable: true }
        priorityFrom: { allOf: [{ $ref: "#/components/schemas/Priority" }], nullable: true }
        priorityTo: { allOf: [{ $ref: "#/components/schemas/Priority" }], nullable: true }
        assigneeName: { type: string, nullable: true }
        code: { allOf: [{ $ref: "#/components/schemas/NotificationCode" }], nullable: true }

    NotificationCode:
      type: object
      required: [provider, kind, ref, branch, target, outcome]
      description: |
        A commit that named the ticket; never its message. Notifications from before 17 Nov may
        name a pull/merge request, CI run or deployment, with the outcome they had then.
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        kind: { $ref: "#/components/schemas/CodeEventKind" }
        ref: { type: string }
        branch: { type: string }
        target: { type: string }
        outcome: { $ref: "#/components/schemas/CodeOutcome" }

    NotificationChannels:
      type: object
      required: [web, email]
      properties:
        web: { type: boolean }
        email: { type: boolean }

    Notification:
      type: object
      required: [id, event, kind, ticket, actorName, statusFrom, statusTo, priorityFrom, priorityTo, reason,
                 assigneeName, slaClock, slaDueAt, slaMinutesLeft, cause, autoApproveAt, reopenUntil, code, quote,
                 also, channels, createdAt, readAt]
      description: |
        One inbox item. `quote` is an excerpt of the message it is about (public messages only
        for client staff). `reason` is a staff reason (a priority change, resolving without the
        Definition of Done); client staff never get one.
      properties:
        id: { type: string, format: uuid }
        event: { $ref: "#/components/schemas/NotificationEvent" }
        kind: { allOf: [{ $ref: "#/components/schemas/NotificationKind" }], nullable: true }
        ticket: { $ref: "#/components/schemas/NotificationTicket" }
        actorName: { type: string, nullable: true, description: Null when the system made the change. }
        statusFrom: { allOf: [{ $ref: "#/components/schemas/TicketStatus" }], nullable: true }
        statusTo: { allOf: [{ $ref: "#/components/schemas/TicketStatus" }], nullable: true }
        priorityFrom: { allOf: [{ $ref: "#/components/schemas/Priority" }], nullable: true }
        priorityTo: { allOf: [{ $ref: "#/components/schemas/Priority" }], nullable: true }
        reason: { type: string, nullable: true }
        assigneeName: { type: string, nullable: true }
        slaClock: { allOf: [{ $ref: "#/components/schemas/SlaClockName" }], nullable: true }
        slaDueAt: { type: string, format: date-time, nullable: true }
        slaMinutesLeft: { type: integer, nullable: true }
        cause:
          allOf: [{ $ref: "#/components/schemas/TicketStatusCause" }]
          nullable: true
          description: Why the status changed, when it wasn't a plain move by hand.
        autoApproveAt:
          type: string
          format: date-time
          nullable: true
          description: A move In UAT; when the fix is approved without an answer.
        reopenUntil:
          type: string
          format: date-time
          nullable: true
          description: A move to Resolved; until when the client can reopen it.
        code: { allOf: [{ $ref: "#/components/schemas/NotificationCode" }], nullable: true }
        quote: { type: string, nullable: true }
        also:
          type: array
          items: { $ref: "#/components/schemas/NotificationAlso" }
        channels: { $ref: "#/components/schemas/NotificationChannels" }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }

    NotificationPage:
      type: object
      required: [items, unreadCount, nextBefore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer }
        nextBefore: { type: string, format: uuid, nullable: true }

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    NotificationReadInput:
      type: object
      required: [read]
      properties:
        read: { type: boolean }

    NotificationEventSetting:
      type: object
      required: [event, web, email, locked]
      properties:
        event: { $ref: "#/components/schemas/NotificationEvent" }
        web: { type: boolean }
        email: { type: boolean }
        locked: { type: boolean, description: Always on; can't be switched off. }

    NotificationSettings:
      type: object
      required: [audience, emailFrequency, events]
      properties:
        audience: { $ref: "#/components/schemas/Audience" }
        emailFrequency: { $ref: "#/components/schemas/EmailFrequency" }
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationEventSetting" }

    NotificationPreferenceInput:
      type: object
      required: [web, email]
      properties:
        web: { type: boolean }
        email: { type: boolean }

    EmailFrequencyInput:
      type: object
      required: [emailFrequency]
      properties:
        emailFrequency: { $ref: "#/components/schemas/EmailFrequency" }

    UatAnswer:
      type: string
      enum: [approve, reject]

    UatAnswerInput:
      type: object
      required: [answer]
      properties:
        answer: { $ref: "#/components/schemas/UatAnswer" }
        message:
          type: string
          maxLength: 20000
          description: What went wrong; needed to reject.

    TicketUat:
      type: object
      required: [autoApproveAt, canAnswer, instructions]
      properties:
        autoApproveAt:
          type: string
          format: date-time
          nullable: true
          description: When the fix is approved without an answer; null when it waits however long it takes.
        canAnswer:
          type: boolean
          description: The viewer may approve or reject.
        instructions:
          type: string
          nullable: true
          description: The team's latest public reply, which says what to test.

    TicketReopen:
      type: object
      required: [until, canReopen]
      properties:
        until:
          type: string
          format: date-time
          description: The ticket can be reopened until then, and closes after it.
        canReopen:
          type: boolean
          description: The viewer may reopen the ticket now.

    BoardCardUat:
      type: object
      required: [day, days]
      properties:
        day:
          type: integer
          description: The working day of the client's test, from 1.
        days:
          type: integer
          nullable: true
          description: Working days before the fix is approved automatically; null when there is no limit.

    UatRequest:
      type: object
      required: [key, subject, project, requester, autoApproveAt, instructions]
      properties:
        key: { type: string, example: HD-24830 }
        subject: { type: string }
        project: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/Ref" }
        autoApproveAt: { type: string, format: date-time, nullable: true }
        instructions:
          type: string
          nullable: true
          description: The team's latest public reply, which says what to test.

    Colleague:
      type: object
      required: [id, name, jobTitle]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Dian Pratama }
        jobTitle: { type: string, nullable: true, example: Head of IT }

    WatcherInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }

    Requester:
      type: object
      required: [id, name, email, jobTitle, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hendra Gunawan }
        email: { type: string }
        jobTitle: { type: string, nullable: true, example: IT Officer }
        status: { $ref: "#/components/schemas/UserStatus" }

    RequesterInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, minLength: 3, maxLength: 254 }
        jobTitle: { type: string, nullable: true, maxLength: 200 }

    Assignee:
      type: object
      required: [id, name, role, jobTitle, openTicketCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Rina Pratiwi }
        role: { $ref: "#/components/schemas/Role" }
        jobTitle: { type: string, nullable: true, example: L2 }
        openTicketCount: { type: integer }

    CatalogItem:
      type: object
      required: [id, name, description, sortOrder, active, ticketCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: VPN / remote access }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }
        active: { type: boolean, description: Shown on the report form. }
        ticketCount: { type: integer }

    CatalogItemInput:
      type: object
      required: [name, sortOrder, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        active: { type: boolean }

    IntakeProject:
      type: object
      required: [id, name, description, targets]
      description: A "Which system?" choice with the targets its tickets get.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        targets:
          type: array
          description: P1 to P4.
          items: { $ref: "#/components/schemas/ProjectTarget" }

    IntakeCatalogItem:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }

    Intake:
      type: object
      required: [clientId, businessHours, projects, defaultProjectId, catalogItems]
      properties:
        clientId: { type: string, format: uuid }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
        projects:
          type: array
          description: The client's active projects, by name.
          items: { $ref: "#/components/schemas/IntakeProject" }
        defaultProjectId:
          type: string
          format: uuid
          nullable: true
          description: The project service requests go to; null while the client has no project.
        catalogItems:
          type: array
          items: { $ref: "#/components/schemas/IntakeCatalogItem" }

    AttachmentPolicy:
      type: object
      required: [maxBytes, maxPerMessage, extensions]
      properties:
        maxBytes: { type: integer, format: int64, example: 10485760 }
        maxPerMessage: { type: integer, example: 5 }
        extensions:
          type: array
          items: { type: string, example: .png }

    Attachment:
      type: object
      required: [id, filename, contentType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string, example: screenshot-login-error.png }
        contentType: { type: string, example: image/png }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    TicketType:
      type: string
      enum: [incident, request]

    TicketStatus:
      type: string
      enum: [new, assigned, in_progress, waiting_on_client, in_uat, resolved, closed]

    TicketChannel:
      type: string
      enum: [portal, phone, email, whatsapp, in_person]

    MessageVisibility:
      type: string
      description: "`internal` notes are never shown to requesters."
      enum: [public, internal]

    TicketAssigneeFilter:
      type: string
      enum: [me, unassigned]

    TicketProgressStep:
      type: string
      enum: [received, assigned, in_progress, ready_for_test, resolved]

    TicketProgressState:
      type: string
      enum: [done, current, upcoming, skipped]

    CodeEventKind:
      type: string
      description: Only commits are read now; the other kinds appear in history from before 17 Nov.
      enum: [commit, pr_opened, pr_merged, pr_closed, pipeline, deployment]

    CodeOutcome:
      type: string
      description: |
        What a commit's key did: `linked` it to the ticket; `ticket_closed`, `unknown_ticket` and
        `other_repository` (the ticket's project reads another repository) were ignored. The
        other values appear in history from before 17 Nov, when Git still moved tickets.
      enum: [linked, in_review, fix_committed, merged, ci_passed, deployed, reopened, ticket_closed, unknown_ticket,
             other_repository]

    TicketActivityCode:
      type: object
      required: [provider, kind, ref, branch, target, outcome]
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        kind: { $ref: "#/components/schemas/CodeEventKind" }
        ref:
          type: string
          description: A short commit sha (history may hold a request or run number, or an environment).
        branch: { type: string, description: The branch the commit was first pushed to. }
        target:
          type: string
          description: History only, the branch a pull/merge request merged into; empty for commits.
        outcome: { $ref: "#/components/schemas/CodeOutcome" }

    TicketActivityAction:
      type: string
      description: "`sla_at_risk` and `sla_breached` name the clock (first_response or resolution) in `to`."
      enum: [created, status_changed, assignee_changed, priority_changed, reply_added, note_added, first_responded,
             sla_at_risk, sla_breached, dod_changed, code_linked]

    TicketStatusCause:
      type: string
      description: |
        Why the status changed when it wasn't a plain move by hand: the system moved it
        (assignment, requester_reply, uat_auto_approved, auto_closed), the client answered
        (uat_approved, uat_rejected, reopened), an agent resolved with the Definition of Done
        unmet (dod_skipped, with the reason). `code_activity`, `code_done` and `code_reopened`
        appear in history only: GitHub/GitLab moved tickets until 17 Nov.
      enum: [assignment, requester_reply, uat_approved, uat_rejected, uat_auto_approved, reopened, auto_closed,
             dod_skipped, code_activity, code_done, code_reopened]

    DodItem:
      type: string
      enum: [uat_approved, requester_confirmed]

    DodSource:
      type: string
      description: "`project` follows the project's Definition of Done; `ticket` has its own."
      enum: [project, ticket]

    TicketDodItem:
      type: object
      required: [item, doneAt, doneBy]
      properties:
        item: { $ref: "#/components/schemas/DodItem" }
        doneAt: { type: string, format: date-time, nullable: true }
        doneBy:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
          description: Null when not done yet, or when the system met it.




    CodeCommit:
      type: object
      required: [provider, sha, title, branches, author, url, at]
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        sha: { type: string, description: The short sha. }
        title: { type: string }
        branches:
          type: array
          minItems: 1
          description: Every branch the commit was pushed to, first one first (the fix branch, then main).
          items: { type: string }
        author: { type: string }
        url: { type: string }
        at: { type: string, format: date-time }

    TicketCode:
      type: object
      required: [repository, commits]
      properties:
        repository:
          allOf: [{ $ref: "#/components/schemas/RepositoryRef" }]
          nullable: true
          description: Where the ticket's project reads commits from.
        commits:
          type: array
          items: { $ref: "#/components/schemas/CodeCommit" }

    BoardCardCode:
      type: object
      required: [provider, commits, sha, branch]
      description: The card's code chip.
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        commits: { type: integer, description: Commits that named the ticket. }
        sha: { type: string, description: The latest commit's short sha. }
        branch: { type: string, description: The last branch the latest commit reached. }



    CommitTestInput:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 5000 }

    CommitTest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items: { $ref: "#/components/schemas/CommitTestRef" }

    CommitTestRef:
      type: object
      required: [key, ticketExists]
      properties:
        key: { type: string, example: HD-24871 }
        ticketExists: { type: boolean }

    CodeEventLog:
      type: object
      required: [id, at, provider, repository, ref, title, branch, url, ticketKey, ticketFound, outcome]
      description: A key a commit named.
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        provider: { $ref: "#/components/schemas/GitProvider" }
        repository: { type: string, description: The repository's full name. }
        ref: { type: string, description: The short sha. }
        title: { type: string, description: The commit's first line. }
        branch: { type: string, description: The branch it was first pushed to. }
        url: { type: string }
        ticketKey: { type: string }
        ticketFound: { type: boolean, description: False when no ticket has the key. }
        outcome: { $ref: "#/components/schemas/CodeOutcome" }

    TicketDod:
      type: object
      required: [source, config, projectConfig, overrideReason, items, met, pending, canOverride]
      properties:
        source: { $ref: "#/components/schemas/DodSource" }
        config:
          description: The Definition of Done the ticket follows.
          allOf: [{ $ref: "#/components/schemas/DodConfig" }]
        projectConfig:
          description: The project's Definition of Done.
          allOf: [{ $ref: "#/components/schemas/DodConfig" }]
        overrideReason: { type: string, nullable: true }
        items:
          type: array
          description: The checklist, in order.
          items: { $ref: "#/components/schemas/TicketDodItem" }
        met: { type: boolean }
        pending:
          type: array
          description: Required items not met yet.
          items: { $ref: "#/components/schemas/DodItem" }
        canOverride:
          type: boolean
          description: The viewer may set or reset the ticket's own Definition of Done.

    TicketDodInput:
      type: object
      required: [dod]
      properties:
        dod:
          allOf: [{ $ref: "#/components/schemas/DodConfig" }]
          nullable: true
          description: null returns the ticket to the project's Definition of Done.
        reason: { type: string, maxLength: 500 }

    TicketSla:
      type: object
      required: [priority, firstResponse, resolution, calendar, pauseOnWaitingClient, pauseOnUat,
                 firstResponseClock, resolutionClock]
      description: |
        The targets for the current priority, from the project's SLA when the ticket was opened,
        and the live clocks (null until the SLA engine has run for the ticket, within a minute).
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        firstResponse: { $ref: "#/components/schemas/Duration" }
        resolution:
          description: Resolve time for incidents, delivery time for service requests.
          allOf: [{ $ref: "#/components/schemas/Duration" }]
        calendar: { $ref: "#/components/schemas/SlaCalendar" }
        pauseOnWaitingClient: { type: boolean }
        pauseOnUat: { type: boolean }
        firstResponseClock: { allOf: [{ $ref: "#/components/schemas/SlaClock" }], nullable: true }
        resolutionClock: { allOf: [{ $ref: "#/components/schemas/SlaClock" }], nullable: true }

    SlaPhase:
      type: string
      description: |
        `at_risk` and `breached` come from the minute-by-minute scan, so they match the alerts;
        `missed` means met after the deadline; `stopped` means the ticket was resolved first.
      enum: [running, at_risk, breached, paused, met, missed, stopped]

    SlaClock:
      type: object
      required: [phase, usedMs, budgetMs, remainingMs, dayMs, dueAt, metAt]
      description: One SLA clock now. Times count on the clock's own calendar (working time or 24/7).
      properties:
        phase: { $ref: "#/components/schemas/SlaPhase" }
        usedMs: { type: integer, format: int64 }
        budgetMs: { type: integer, format: int64 }
        remainingMs: { type: integer, format: int64, description: Negative once over the target. }
        dayMs: { type: integer, format: int64, description: "One day on this clock's calendar: a working day, or 24 hours." }
        dueAt: { type: string, format: date-time, nullable: true, description: Null while paused or stopped. }
        metAt: { type: string, format: date-time, nullable: true }

    TicketProgress:
      type: object
      required: [step, state, at]
      properties:
        step: { $ref: "#/components/schemas/TicketProgressStep" }
        state: { $ref: "#/components/schemas/TicketProgressState" }
        at: { type: string, format: date-time, nullable: true }

    TicketSummary:
      type: object
      required: [id, key, type, status, priority, subject, client, requester, assignee, createdAt, updatedAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: HD-24871 }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string, example: e-Office login fails for all staff }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/Ref" }
        assignee:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    BoardColumnId:
      type: string
      enum: [new, in_progress, waiting_on_client, in_uat, resolved]

    BoardSlaFilter:
      type: string
      enum: [at_risk]

    BoardCardSla:
      type: object
      required: [clock, phase, remainingMs, dayMs]
      description: The clock a card shows (an open ticket's first response until it is sent, then resolution).
      properties:
        clock: { $ref: "#/components/schemas/SlaClockName" }
        phase: { $ref: "#/components/schemas/SlaPhase" }
        remainingMs: { type: integer, format: int64, description: Negative once over the target. }
        dayMs: { type: integer, format: int64 }

    BoardCard:
      type: object
      required: [id, key, type, status, priority, subject, client, assignee, allowedStatuses, sla, dodPending, uat,
                 code]
      properties:
        sla:
          allOf: [{ $ref: "#/components/schemas/BoardCardSla" }]
          nullable: true
          description: Null until the SLA engine has run for the ticket.
        id: { type: string, format: uuid }
        key: { type: string, example: HD-24871 }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string }
        client: { $ref: "#/components/schemas/Ref" }
        assignee:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        allowedStatuses:
          type: array
          description: The statuses the viewer may move this ticket to.
          items: { $ref: "#/components/schemas/TicketStatus" }
        dodPending:
          type: array
          description: What an open ticket's Definition of Done still needs; resolving before then needs a reason.
          items: { $ref: "#/components/schemas/DodItem" }
        uat:
          allOf: [{ $ref: "#/components/schemas/BoardCardUat" }]
          nullable: true
          description: Set while the client tests.
        code:
          allOf: [{ $ref: "#/components/schemas/BoardCardCode" }]
          nullable: true
          description: Set once code reached the ticket.

    BoardColumn:
      type: object
      required: [id, total, cards]
      properties:
        id: { $ref: "#/components/schemas/BoardColumnId" }
        total:
          type: integer
          description: Every ticket in the column, including those past the card limit.
        cards:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/BoardCard" }

    BoardStats:
      type: object
      required: [openTickets, resolvedThisWeek, slaBreached, slaAtRisk, slaOldest, avgFirstResponseMs, withinSlaPercent]
      properties:
        openTickets: { type: integer }
        resolvedThisWeek:
          type: integer
          description: Resolved or closed since Monday 00:00 in the organisation's time zone.
        slaBreached: { type: integer, description: Open tickets with an unmet clock past its deadline. }
        slaAtRisk: { type: integer, description: Open tickets at risk and not breached. }
        slaOldest:
          allOf: [{ $ref: "#/components/schemas/SlaProblem" }]
          nullable: true
          description: The flagged ticket that fell due first (the banner names it).
        avgFirstResponseMs:
          type: integer
          format: int64
          nullable: true
          description: Mean first-response time of portal reports answered this month, on their SLA clocks.
        withinSlaPercent:
          type: number
          format: double
          nullable: true
          description: Share of tickets resolved this month that never breached, 0 to 100.

    SlaProblem:
      type: object
      required: [key, clientName]
      properties:
        key: { type: string }
        clientName: { type: string }

    Board:
      type: object
      required: [columns, resolvedSince, stats]
      properties:
        columns:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/BoardColumn" }
        resolvedSince:
          type: string
          format: date-time
          description: Local midnight; the resolved column starts here.
        stats: { $ref: "#/components/schemas/BoardStats" }

    Ticket:
      type: object
      required: [id, key, type, status, priority, subject, client, requester, assignee, createdAt, updatedAt,
                 resolvedAt, channel, description, requesterJobTitle, project, catalogItem, createdBy,
                 loggedByStaff, attachments, sla, slaTargets, firstResponseAt, closedAt, progress, allowedStatuses,
                 dod, uat, reopen]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: HD-24871 }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/Ref" }
        assignee:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        channel: { $ref: "#/components/schemas/TicketChannel" }
        description: { type: string }
        requesterJobTitle: { type: string, nullable: true }
        project: { $ref: "#/components/schemas/Ref" }
        catalogItem:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        createdBy: { $ref: "#/components/schemas/Ref" }
        loggedByStaff:
          type: boolean
          description: An agent logged the ticket on the requester's behalf.
        attachments:
          type: array
          description: Files on the description.
          items: { $ref: "#/components/schemas/Attachment" }
        sla: { $ref: "#/components/schemas/TicketSla" }
        slaTargets:
          type: array
          description: Every priority's targets from the ticket's SLA snapshot, P1 to P4.
          items: { $ref: "#/components/schemas/ProjectTarget" }
        firstResponseAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        progress:
          type: array
          description: The requester's progress tracker, in order.
          items: { $ref: "#/components/schemas/TicketProgress" }
        allowedStatuses:
          type: array
          description: Manual status changes open to the user; empty for requesters.
          items: { $ref: "#/components/schemas/TicketStatus" }
        dod:
          allOf: [{ $ref: "#/components/schemas/TicketDod" }]
          nullable: true
          description: Staff only; null for requesters.
        uat:
          allOf: [{ $ref: "#/components/schemas/TicketUat" }]
          nullable: true
          description: Set while the ticket waits In UAT for the client's test.
        reopen:
          allOf: [{ $ref: "#/components/schemas/TicketReopen" }]
          nullable: true
          description: Set while the ticket is resolved.

    TicketInput:
      type: object
      required: [type, priority, subject, description]
      properties:
        type: { $ref: "#/components/schemas/TicketType" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        projectId:
          type: string
          format: uuid
          description: Incidents only, one of the client's active projects. Service requests go to the default project.
        catalogItemId:
          type: string
          format: uuid
          description: Service requests only.
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        clientId:
          type: string
          format: uuid
          description: Staff only.
        requesterId:
          type: string
          format: uuid
          description: Staff only; a requester of the client.
        channel:
          allOf: [{ $ref: "#/components/schemas/TicketChannel" }]
          description: Staff only; any channel except portal.
        assignToMe:
          type: boolean
          description: Staff only.

    TicketMessage:
      type: object
      required: [id, author, authorJobTitle, fromSupport, visibility, body, attachments, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Ref" }
        authorJobTitle: { type: string, nullable: true }
        fromSupport:
          type: boolean
          description: Written by vendor staff rather than the client.
        visibility: { $ref: "#/components/schemas/MessageVisibility" }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        createdAt: { type: string, format: date-time }

    TicketMessageInput:
      type: object
      required: [visibility, body]
      properties:
        visibility: { $ref: "#/components/schemas/MessageVisibility" }
        body: { type: string, minLength: 1, maxLength: 20000 }
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }

    TicketStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }
        from: { $ref: "#/components/schemas/TicketStatus" }
        reason:
          type: string
          maxLength: 500
          description: Needed to resolve a ticket whose Definition of Done isn't met.

    TicketAssigneeInput:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: null unassigns.

    TicketPriorityInput:
      type: object
      required: [priority, reason]
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    TicketActivity:
      type: object
      required: [id, at, actorName, action, from, to, reason, cause, channel, code]
      description: |
        One activity-log line. `from`/`to` hold statuses (status_changed), priorities
        (priority_changed) or assignee names (assignee_changed; null = unassigned).
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorName:
          type: string
          nullable: true
          description: null for the system.
        action: { $ref: "#/components/schemas/TicketActivityAction" }
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        cause:
          allOf: [{ $ref: "#/components/schemas/TicketStatusCause" }]
          nullable: true
        channel:
          allOf: [{ $ref: "#/components/schemas/TicketChannel" }]
          nullable: true
          description: Set on created.
        code:
          allOf: [{ $ref: "#/components/schemas/TicketActivityCode" }]
          nullable: true
          description: Set on code_linked.

    SlaReport:
      type: object
      required: [month, currentMonth, firstMonth, toDate, targetPercent, waitingPause, totals,
        clientsWithTickets, clientsBelowTarget, clients]
      properties:
        month: { type: string, description: "The report's month, e.g. `2026-11`." }
        currentMonth: { type: string, description: "This month in the organisation's time zone." }
        firstMonth:
          type: string
          nullable: true
          description: The month of the first ticket ever; null without tickets.
        toDate: { type: boolean, description: The month hasn't ended yet. }
        targetPercent:
          type: number
          format: double
          description: The contract target for the share of tickets within SLA, 0 to 100.
        waitingPause:
          allOf: [{ $ref: "#/components/schemas/SlaWaitingPause" }]
          nullable: true
          description: Null without tickets.
        totals: { $ref: "#/components/schemas/SlaFigures" }
        clientsWithTickets: { type: integer }
        clientsBelowTarget:
          type: integer
          description: Clients with tickets and a share within SLA under the target.
        clients:
          type: array
          items: { $ref: "#/components/schemas/SlaReportClient" }

    SlaWaitingPause:
      type: string
      enum: [all, some, none]
      description: |
        How many of the month's tickets stop their resolution clock while waiting on the
        client (each ticket follows its project's SLA as it was when the ticket was created).

    SlaReportClient:
      type: object
      required: [id, name, belowTarget, figures]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        belowTarget: { type: boolean }
        figures: { $ref: "#/components/schemas/SlaFigures" }

    SlaFigures:
      type: object
      required: [tickets, incidents, requests, breaches, withinSlaPercent, avgFirstResponseMs]
      properties:
        tickets: { type: integer }
        incidents: { type: integer }
        requests: { type: integer }
        breaches: { type: integer, description: Tickets that missed a target, met late included. }
        withinSlaPercent:
          type: number
          format: double
          nullable: true
          description: Share of tickets without a breach, 0 to 100; null without tickets.
        avgFirstResponseMs:
          type: integer
          format: int64
          nullable: true
          description: |
            Mean first-response time of answered portal reports, on their SLA clocks. Tickets the
            team logs are answered when logged and are left out. Null when none.

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password: { type: string, minLength: 10, maxLength: 128 }

    SetupRequest:
      type: object
      required: [organizationName, name, email, password]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200, example: PT Vendor Teknologi }
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }

    StaffRole:
      type: string
      description: The team's roles; client staff (requester) are invited on their client.
      enum: [admin, supervisor, agent]

    MemberInvite:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, format: email, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/StaffRole" }
        jobTitle: { type: string, maxLength: 100 }

    MemberRoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/StaffRole" }

    Member:
      type: object
      required: [id, email, name, role, jobTitle, status, lastLoginAt, inviteSentAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        jobTitle: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/UserStatus" }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        inviteSentAt:
          type: string
          format: date-time
          nullable: true
          description: When the latest invite went out; null when none was sent (the CLI or seed made the account).

    MemberCounts:
      type: object
      description: People with access or an invite, per role; suspended accounts aren't counted.
      required: [admin, supervisor, agent, requester]
      properties:
        admin: { type: integer }
        supervisor: { type: integer }
        agent: { type: integer }
        requester: { type: integer }

    Members:
      type: object
      required: [counts, team]
      properties:
        counts: { $ref: "#/components/schemas/MemberCounts" }
        team:
          type: array
          items: { $ref: "#/components/schemas/Member" }
