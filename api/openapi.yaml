openapi: 3.0.3
info:
  title: SimDesk API
  version: 0.1.0
  description: |
    API for SimDesk, an open-source self-hosted helpdesk.

    Authentication uses a session cookie set by `POST /auth/login`. The cookie is
    named `sd_session` over plain HTTP (development) and `__Host-sd_session` over HTTPS.
    Every operation requires a session unless it is marked public (`security: []`).

    An install holds one or more vendor organizations. A request works in the organization
    named by the `X-Organization-Id` header (the web app keeps it per tab); without it, in the
    user's last one. Organization data (clients, projects, tickets, settings) is always that
    organization's. Staff who belong to no organization get `organization_required` (409).

    Errors use RFC 9457 problem details (`application/problem+json`).
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: organization
  - name: auth
  - name: users
  - name: clients
  - name: sla
  - name: calendar
  - name: tickets
  - name: attachments
  - name: catalog
  - name: projects
  - name: notifications
  - name: integrations
  - name: reports

paths:
  /install:
    get:
      operationId: getInstall
      summary: The install, for the sign-in and setup pages (public)
      description: Whether first-run setup is still open, and where emails link to.
      tags: [organization]
      security: []
      responses:
        "200":
          description: The install
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Install" }
        default: { $ref: "#/components/responses/Problem" }

  /organizations:
    get:
      operationId: listOrganizations
      summary: Every organization on the install (admin only)
      tags: [organization]
      responses:
        "200":
          description: Organizations, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrganization
      summary: Add a vendor organization (admin only)
      description: |
        It starts with the default priorities and business hours (Mon–Fri 08:00–17:00). Error
        codes `invalid_organization` (400, with fields) and `ticket_prefix_taken` (409).
      tags: [organization]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /organization:
    get:
      operationId: getOrganization
      summary: The organization the request works in
      description: Its name, logo, prefix and time zone, for the app header, the portal and the footer.
      tags: [organization]
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateOrganization
      summary: Change the organisation's name, ticket prefix and time zone (admin only)
      description: |
        A new prefix applies to new tickets; existing keys never change. A new time zone
        recomputes open tickets' SLA clocks. Error code `invalid_organization` (400, with fields).
      tags: [organization]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /organizations/{organizationId}/logo:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganizationLogoById
      summary: An organization's logo (public, for the app header, the portal and emails)
      description: "`v` is the version in `logoUrl`; a new logo gets a new URL, so the image can be cached for good."
      tags: [organization]
      security: []
      parameters:
        - { name: v, in: query, required: false, schema: { type: string, maxLength: 20 } }
      responses:
        "200":
          description: The logo
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /me/organization:
    put:
      operationId: setMyOrganization
      summary: Remember the organization the user works in
      description: |
        The web app sends the chosen organization with every request (`X-Organization-Id`);
        this makes it where the next sign-in starts. Requesters can't change theirs (403); an
        organization the user doesn't belong to is a 404.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId: { type: string, format: uuid }
      responses:
        "200":
          description: The user, working in that organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /organization/logo:
    get:
      operationId: getOrganizationLogo
      summary: The organisation's logo (public, for the sign-in page, portal and emails)
      description: "`v` is the version in `logoUrl`; a new logo gets a new URL, so the image can be cached for good."
      tags: [organization]
      security: []
      parameters:
        - { name: v, in: query, required: false, schema: { type: string, maxLength: 20 } }
      responses:
        "200":
          description: The logo
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: uploadOrganizationLogo
      summary: Replace the logo (admin only)
      description: |
        PNG, JPEG or WebP, up to 512 KB; no SVG. Error codes `logo_type_not_allowed` (400) and
        `logo_too_large` (413).
      tags: [organization]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeOrganizationLogo
      summary: Remove the logo; the organisation's initials show instead (admin only)
      tags: [organization]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly, SameSite=Lax).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and end the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always returns 202, whether or not the email belongs to a user.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: If the account exists, a reset link is on its way.
        default: { $ref: "#/components/responses/Problem" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Signs the user out everywhere. Error codes are `invalid_token` and `weak_password`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204":
          description: Password changed.
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/invite/accept:
    post:
      operationId: acceptInvite
      summary: Set the first password from an invite link and sign in
      description: |
        The link works once and for 7 days, and only while the account waits for its first
        password. Error codes are `invalid_token`, `weak_password` and `rate_limited` (429).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Password set and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly, SameSite=Lax).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }

  /setup:
    post:
      operationId: completeSetup
      summary: First-run setup - name the organisation and create the first administrator
      description: |
        Open only until setup completes (`setupRequired` on `GET /organization`): this form or
        `simdesk user create --role admin` closes it for good. The new administrator is signed
        in. Error codes are `setup_closed` (409), `invalid_organization`, `invalid_name`,
        `invalid_email`, `weak_password`, `email_taken` (409) and `rate_limited` (429).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Set up and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly, SameSite=Lax).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }

  /members:
    get:
      operationId: listMembers
      summary: The team and how many people hold each role (admin only)
      description: Client staff are counted but not listed; they are managed on their client.
      tags: [users]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Members" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: inviteMember
      summary: Invite someone to the team (admin only)
      description: |
        Creates the account without a password and emails a link to set one. Error codes are
        `email_taken` (409), `invalid_email`, `invalid_name` and `invalid_role`.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvite" }
      responses:
        "201":
          description: Invited
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /members/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeMember
      summary: Take a supervisor or agent off the organization (admin only)
      description: |
        Their account stays, with any other organization they work in; their client links here
        go. Refused with `member_has_open_tickets` (409) while open tickets here are assigned to
        them: reassign those first. Administrators work in every organization (`invalid_role`).
      tags: [users]
      responses:
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /members/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: changeMemberRole
      summary: Move a team member to another role (admin only)
      description: |
        An agent who stops being one is unlinked from their clients; tickets assigned to them stay
        theirs. Error codes are `last_admin` and `cannot_change_self` (409).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleInput" }
      responses:
        "204":
          description: Changed
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /members/{userId}/suspend:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: suspendMember
      summary: Stop someone signing in, at once (admin only)
      description: |
        Works for team members and client staff. Their sessions end; an agent is unlinked from
        their clients and keeps their assigned tickets. Error codes are `last_admin` and
        `cannot_change_self` (409).
      tags: [users]
      responses:
        "204":
          description: Suspended
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /members/{userId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: reactivateMember
      summary: Let a suspended person back in (admin only)
      description: Someone who never set a password goes back to invited; resend their invite.
      tags: [users]
      responses:
        "204":
          description: Reactivated
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /members/{userId}/invite:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resendInvite
      summary: Email a new invite link (admin only)
      description: Earlier links stop working. Error code `not_invited` (409) once the password is set.
      tags: [users]
      responses:
        "204":
          description: Sent
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /users:
    get:
      operationId: listUsers
      summary: List all users (admin only)
      tags: [users]
      responses:
        "200":
          description: Users ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients:
    get:
      operationId: listClients
      summary: Clients the user may see, by name
      description: Admins and supervisors see every client; agents see the clients assigned to them.
      tags: [clients]
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      summary: Add a client (admin only)
      description: Error codes are `invalid_name`, `invalid_email`, `invalid_contract_period` and `client_name_taken` (409).
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: getClient
      summary: One client
      tags: [clients]
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateClient
      summary: Replace a client's details (admin only)
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteClient
      summary: Delete a client with no requesters and no tickets (admin only)
      description: Error code `client_in_use` (409) while requesters or tickets belong to the client.
      tags: [clients]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}/agents:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    put:
      operationId: setClientAgents
      summary: Replace the agents assigned to a client (admin only)
      description: Every user must be an active agent (`invalid_agent`).
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientAgentsInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}/requesters:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: listClientRequesters
      summary: A client's active and invited requesters, by name
      description: |
        Staff only; agents see only their assigned clients (404 otherwise). Administrators can
        add `includeSuspended=true` to manage suspended requesters too (403 for anyone else).
      tags: [clients]
      parameters:
        - name: includeSuspended
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Requesters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Requester" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClientRequester
      summary: Invite a requester to a client (admin only)
      description: |
        The requester is `invited` and gets an email with a single-use link to set their
        password. Resend, suspend and reactivate them with the `/members/{userId}` actions. Error
        codes are `invalid_name`, `invalid_email` and `email_taken` (409).
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequesterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requester" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}/assignees:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: listClientAssignees
      summary: Who can take a client's tickets
