openapi: 3.0.3
info:
  title: SimDesk API
  version: 0.1.0
  description: |
    API for SimDesk, an open-source self-hosted helpdesk.

    Authentication uses a session cookie set by `POST /auth/login`. The cookie is
    named `sd_session` over plain HTTP (development) and `__Host-sd_session` over HTTPS.
    Every operation requires a session unless it is marked public (`security: []`).

    Errors use RFC 9457 problem details (`application/problem+json`).
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: organization
  - name: auth
  - name: users
  - name: clients
  - name: sla
  - name: calendar
  - name: tickets
  - name: attachments
  - name: catalog
  - name: projects

paths:
  /organization:
    get:
      operationId: getOrganization
      summary: Public organisation branding for the sign-in page and footer
      tags: [organization]
      security: []
      responses:
        "200":
          description: Organisation branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly, SameSite=Lax).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and end the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always returns 202, whether or not the email belongs to a user.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: If the account exists, a reset link is on its way.
        default: { $ref: "#/components/responses/Problem" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Signs the user out everywhere. Error codes are `invalid_token` and `weak_password`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204":
          description: Password changed.
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /users:
    get:
      operationId: listUsers
      summary: List all users (admin only)
      tags: [users]
      responses:
        "200":
          description: Users ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients:
    get:
      operationId: listClients
      summary: Clients the user may see, by name
      description: Admins and supervisors see every client; agents see the clients assigned to them.
      tags: [clients]
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      summary: Add a client (admin only)
      description: Error codes are `invalid_name`, `invalid_email`, `invalid_contract_period`, `sla_plan_not_found` and `client_name_taken` (409).
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: getClient
      summary: One client
      tags: [clients]
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateClient
      summary: Replace a client's details (admin only)
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteClient
      summary: Delete a client with no requesters and no tickets (admin only)
      description: Error code `client_in_use` (409) while requesters or tickets belong to the client.
      tags: [clients]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}/agents:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    put:
      operationId: setClientAgents
      summary: Replace the agents assigned to a client (admin only)
      description: Every user must be an active agent (`invalid_agent`).
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientAgentsInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}/requesters:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: listClientRequesters
      summary: A client's active and invited requesters, by name
      description: Staff only; agents see only their assigned clients (404 otherwise).
      tags: [clients]
      responses:
        "200":
          description: Requesters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Requester" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClientRequester
      summary: Add a requester to a client
      description: |
        For agents logging a call from someone new. The requester is `invited` and has no
        password until an invite sets one. Error codes are `invalid_name`, `invalid_email` and
        `email_taken` (409).
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequesterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requester" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /clients/{clientId}/assignees:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      operationId: listClientAssignees
      summary: Who can take a client's tickets
      description: Active supervisors and admins, plus active agents assigned to the client, with their open tickets.
      tags: [clients]
      responses:
        "200":
          description: Assignees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignee" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sla-plans:
    get:
      operationId: listSlaPlans
      summary: SLA plans, the default first
      tags: [sla]
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SlaPlan" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSlaPlan
      summary: Add an SLA plan (admin only)
      description: Error codes are `invalid_name`, `invalid_sla_targets` and `sla_plan_name_taken` (409).
      tags: [sla]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPlanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sla-plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getSlaPlan
      summary: One SLA plan
      tags: [sla]
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaPlan" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateSlaPlan
      summary: Replace a plan's name and targets (admin only)
      tags: [sla]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPlanInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSlaPlan
      summary: Delete a plan no client uses (admin only)
      description: Error codes `sla_plan_is_default` and `sla_plan_in_use` (409).
      tags: [sla]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /sla-plans/{planId}/default:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: setDefaultSlaPlan
      summary: Make a plan the default for new clients (admin only)
      tags: [sla]
      responses:
        "200":
          description: The new default plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlaPlan" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /priorities:
    get:
      operationId: listPriorityLevels
      summary: Priority names and descriptions, P1 to P4
      description: Shared by every project. Requesters read them when they pick a priority.
      tags: [sla]
      responses:
        "200":
          description: Priority levels, P1 first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriorityLevel" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePriorityLevels
      summary: Rename the priorities (admin only)
      description: Send all four levels. Error code `invalid_priority_levels`.
      tags: [sla]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: "#/components/schemas/PriorityLevel" }
      responses:
        "200":
          description: Updated, P1 first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriorityLevel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /projects:
    get:
      operationId: listProjects
      summary: Projects the user may see, by client and name
      description: |
        Staff only. Admins and supervisors see every project; agents see the projects of the
        clients assigned to them. With `clientId`, a client the user can't see is a 404.
      tags: [projects]
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      summary: Add a project (supervisors and admins)
      description: |
        The project starts with the default SLA. A client's first project becomes its default.
        Error codes are `invalid_name`, `client_not_found`, `project_is_default` (a hidden default)
        and `project_name_taken` (409).
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: One project
      tags: [projects]
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateProject
      summary: Change a project's details (supervisors and admins)
      description: |
        Making a project the default moves service requests to it. The default can't be unset
        or hidden directly (`project_is_default`): make another project the default instead.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProject
      summary: Delete a project (supervisors and admins)
      description: The default can't be deleted while the client has other active projects (`project_is_default`, 409).
      tags: [projects]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /projects/{projectId}/sla:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: updateProjectSla
      summary: Replace a project's SLA targets and settings (supervisors and admins)
      description: |
        New tickets use the new targets; open tickets keep the ones they started with. First
        response must be shorter than resolve and deliver (`invalid_sla_targets`), comparing a
        working day as one business-hours window and a day as 24 hours.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectSla" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /business-hours:
    get:
      operationId: getBusinessHours
      summary: The organisation's working hours
      tags: [calendar]
      responses:
        "200":
          description: Working hours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessHours" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateBusinessHours
      summary: Replace the working hours (admin only)
      description: Error code `invalid_business_hours`. Targets are stored in minutes, so this changes how long a working day is.
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessHoursInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessHours" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /holidays:
    get:
      operationId: listHolidays
      summary: Holidays in date order
      tags: [calendar]
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer, minimum: 1970, maximum: 9999 }
      responses:
        "200":
          description: Holidays
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Holiday" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createHoliday
      summary: Add a holiday (admin only)
      description: Error codes `invalid_name` and `holiday_date_taken` (409).
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HolidayInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Holiday" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /holidays/{holidayId}:
    parameters:
      - name: holidayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteHoliday
      summary: Delete a holiday (admin only)
      tags: [calendar]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /holiday-presets:
    get:
      operationId: listHolidayPresets
      summary: Bundled official holiday lists (admin only)
      tags: [calendar]
      responses:
        "200":
          description: Presets by year
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HolidayPreset" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /holiday-presets/{year}/load:
    parameters:
      - name: year
        in: path
        required: true
        schema: { type: integer, minimum: 1970, maximum: 9999 }
    post:
      operationId: loadHolidayPreset
      summary: Add a bundled year's missing holidays (admin only)
      description: Dates that already have a holiday are left as they are.
      tags: [calendar]
      responses:
        "200":
          description: Loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolidayPresetLoadResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /intake:
    get:
      operationId: getIntake
      summary: What a report form offers for one client
      description: |
        The client's SLA targets, the working hours, and the visible systems and catalogue items.
        Requesters always get their own client and leave `clientId` out; staff must pass a client
        they may see (`client_required`, 404).
      tags: [tickets]
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Form choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intake" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /attachment-policy:
    get:
      operationId: getAttachmentPolicy
      summary: Upload limits and allowed file extensions
      tags: [attachments]
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /systems:
    get:
      operationId: listSystems
      summary: Every system, in display order (staff)
      tags: [catalog]
      responses:
        "200":
          description: Systems
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSystem
      summary: Add a system (admin only)
      description: Error codes are `invalid_name` and `system_name_taken` (409).
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /systems/{systemId}:
    parameters:
      - $ref: "#/components/parameters/SystemId"
    put:
      operationId: updateSystem
      summary: Replace a system (admin only)
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSystem
      summary: Delete a system no ticket uses (admin only)
      description: Error code `system_in_use` (409); hide it instead.
      tags: [catalog]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /catalog-items:
    get:
      operationId: listCatalogItems
      summary: Every catalogue item, in display order (staff)
      tags: [catalog]
      responses:
        "200":
          description: Catalogue items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCatalogItem
      summary: Add a catalogue item (admin only)
      description: Error codes are `invalid_name`, `invalid_delivery_time` and `catalog_item_name_taken` (409).
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /catalog-items/{catalogItemId}:
    parameters:
      - $ref: "#/components/parameters/CatalogItemId"
    put:
      operationId: updateCatalogItem
      summary: Replace a catalogue item (admin only)
      description: Open tickets keep the delivery time they were created with.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCatalogItem
      summary: Delete a catalogue item no ticket uses (admin only)
      description: Error code `catalog_item_in_use` (409); hide it instead.
      tags: [catalog]
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets:
    get:
      operationId: listTickets
      summary: Tickets the user may see, newest first
      description: |
        Requesters see their client's tickets; agents the tickets of their assigned clients;
        supervisors and admins every ticket. Page with `before` = the last id of the previous page.
      tags: [tickets]
      parameters:
        - name: status
          in: query
          required: false
          description: Any of these statuses; all when left out.
          schema:
            type: array
            maxItems: 7
            items: { $ref: "#/components/schemas/TicketStatus" }
        - name: clientId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: assignee
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TicketAssigneeFilter" }
        - name: q
          in: query
          required: false
          description: A ticket key, or words in the subject.
          schema: { type: string, maxLength: 100 }
        - name: before
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: Open a ticket
      description: |
        Requesters report for themselves (channel `portal`); the staff-only fields are ignored.
        Staff log a ticket for a client's requester and must give `clientId`, `requesterId` and a
        non-portal `channel`. Error codes are `invalid_subject`, `invalid_description`,
        `invalid_system`, `invalid_catalog_item`, `client_required`, `client_not_found`,
        `invalid_requester`, `invalid_channel`, `invalid_assignee`, `invalid_attachment` and
        `too_many_attachments`.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getTicket
      summary: One ticket
      description: 404 when the user may not see it.
      tags: [tickets]
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/messages:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketMessages
      summary: The ticket's conversation, oldest first
      description: Requesters get public messages only.
      tags: [tickets]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketMessage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicketMessage
      summary: Reply, or add an internal note (staff)
      description: |
        A requester asking for `internal` gets 403. Error codes are `invalid_message`,
        `invalid_attachment`, `too_many_attachments` and `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketMessageInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/status:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketStatus
      summary: Move the ticket (staff)
      description: Only the moves in the ticket's `allowedStatuses`; otherwise `invalid_status_change` or `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketStatusInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/assignee:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketAssignee
      summary: Assign or unassign the ticket (staff)
      description: Error codes are `invalid_assignee` and `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketAssigneeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/priority:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    put:
      operationId: setTicketPriority
      summary: Change the priority, with a reason (staff)
      description: The reason goes to the audit log. Error codes are `reason_required` and `ticket_closed` (409).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPriorityInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /tickets/{ticketKey}/activity:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketActivity
      summary: The ticket's activity log, oldest first (staff)
      tags: [tickets]
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketActivity" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /attachments:
    post:
      operationId: uploadAttachment
      summary: Upload one file
      description: |
        The file waits, unlinked, until a new ticket or message names it in `attachmentIds`; unlinked
        files are deleted after 24 hours. Error codes are `attachment_too_large` (413),
        `attachment_type_not_allowed`, `attachment_empty`, `invalid_attachment` and
        `too_many_pending_attachments` (409).
      tags: [attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: downloadAttachment
      summary: Download a file on a ticket the user may see
      description: Always served as a download. Files on internal notes are hidden from requesters (404).
      tags: [attachments]
      responses:
        "200":
          description: The file
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            Content-Security-Policy:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sd_session
      description: "`__Host-sd_session` when served over HTTPS."

  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketKey:
      name: ticketKey
      in: path
      required: true
      description: A ticket key such as HD-24871 (case-insensitive).
      schema: { type: string, maxLength: 30, pattern: "^[A-Za-z][A-Za-z0-9]{0,9}-[0-9]{1,18}$" }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SystemId:
      name: systemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CatalogItemId:
      name: catalogItemId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Unauthorized }
        status: { type: integer, example: 401 }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable error code, e.g. `invalid_credentials`.
          example: invalid_credentials
        requestId: { type: string }
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Role:
      type: string
      enum: [admin, supervisor, agent, requester]

    UserStatus:
      type: string
      enum: [active, invited, suspended]

    ClientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Organization:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, example: Demo Vendor }
        timezone:
          type: string
          description: IANA time zone; times are shown in it.
          example: Asia/Jakarta
        logoUrl: { type: string, nullable: true }
        footerNote:
          type: string
          nullable: true
          example: Data stored in Indonesia · Personal data handled under UU PDP

    Me:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        jobTitle: { type: string, nullable: true, example: L2 }
        client:
          allOf: [{ $ref: "#/components/schemas/ClientRef" }]
          nullable: true
          description: Set for requesters only.

    User:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        jobTitle: { type: string, nullable: true }
        client:
          allOf: [{ $ref: "#/components/schemas/ClientRef" }]
          nullable: true
        lastLoginAt: { type: string, format: date-time, nullable: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 10 to 128 characters.

    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Priority:
      type: string
      enum: [P1, P2, P3, P4]

    SlaCalendar:
      type: string
      description: "`business_hours` counts working minutes only; `always` runs 24/7."
      enum: [business_hours, always]

    Weekday:
      type: string
      enum: [sun, mon, tue, wed, thu, fri, sat]

    Client:
      type: object
      required: [id, name, contractNo, contractStart, contractEnd, picName, picEmail, slaPlan,
                 requesterCount, agents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Dinas Kominfo Jambi }
        contractNo: { type: string, nullable: true, example: KTR/KOMINFO-JMB/006/2026 }
        contractStart: { type: string, format: date, nullable: true }
        contractEnd: { type: string, format: date, nullable: true }
        picName: { type: string, nullable: true }
        picEmail: { type: string, nullable: true }
        slaPlan: { $ref: "#/components/schemas/Ref" }
        requesterCount: { type: integer }
        agents:
          type: array
          description: Agents assigned to this client, by name.
          items: { $ref: "#/components/schemas/Ref" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClientInput:
      type: object
      required: [name, slaPlanId]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        contractNo: { type: string, nullable: true, maxLength: 100 }
        contractStart: { type: string, format: date, nullable: true }
        contractEnd: { type: string, format: date, nullable: true }
        picName: { type: string, nullable: true, maxLength: 200 }
        picEmail: { type: string, nullable: true, maxLength: 254 }
        slaPlanId: { type: string, format: uuid }

    ClientAgentsInput:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }

    SlaTarget:
      type: object
      required: [priority, firstResponseMinutes, resolveMinutes, deliverMinutes, deliverFromCatalog, calendar]
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        firstResponseMinutes: { type: integer, minimum: 1, maximum: 525600 }
        resolveMinutes:
          type: integer
          minimum: 1
          maximum: 525600
          description: Incidents.
        deliverMinutes:
          type: integer
          minimum: 1
          maximum: 525600
          description: Service requests.
        deliverFromCatalog:
          type: boolean
          description: Service requests use the catalogue item's delivery time, falling back to deliverMinutes.
        calendar: { $ref: "#/components/schemas/SlaCalendar" }

    SlaPlan:
      type: object
      required: [id, name, isDefault, clientCount, targets]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Standard }
        isDefault: { type: boolean }
        clientCount: { type: integer }
        targets:
          type: array
          description: One per priority, P1 to P4.
          items: { $ref: "#/components/schemas/SlaTarget" }

    SlaPlanInput:
      type: object
      required: [name, targets]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        targets:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/SlaTarget" }

    PriorityLevel:
      type: object
      required: [code, name, description]
      properties:
        code: { $ref: "#/components/schemas/Priority" }
        name: { type: string, minLength: 1, maxLength: 40, example: Critical }
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: A public service or the whole office is down

    DurationUnit:
      type: string
      description: "`min` minutes, `h` hours, `wd` working days (one business-hours window), `d` calendar days."
      enum: [min, h, wd, d]

    Duration:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer, minimum: 1, maximum: 525600 }
        unit: { $ref: "#/components/schemas/DurationUnit" }

    ProjectTarget:
      type: object
      required: [priority, firstResponse, resolve, deliver, calendar]
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        firstResponse: { $ref: "#/components/schemas/Duration" }
        resolve:
          description: Incidents.
          allOf: [{ $ref: "#/components/schemas/Duration" }]
        deliver:
          description: Service requests.
          allOf: [{ $ref: "#/components/schemas/Duration" }]
        calendar: { $ref: "#/components/schemas/SlaCalendar" }

    AtRiskPercent:
      type: integer
      description: Share of a target that may pass before a ticket counts as at risk.
      enum: [50, 75, 90]

    ProjectSla:
      type: object
      required: [targets, pauseOnWaitingClient, pauseOnUat, atRiskPercent, notifySupervisorOnBreach, notifyPicOnP1Breach]
      properties:
        targets:
          type: array
          description: One per priority, P1 to P4.
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/ProjectTarget" }
        pauseOnWaitingClient: { type: boolean }
        pauseOnUat: { type: boolean }
        atRiskPercent: { $ref: "#/components/schemas/AtRiskPercent" }
        notifySupervisorOnBreach: { type: boolean }
        notifyPicOnP1Breach: { type: boolean }

    Project:
      type: object
      required: [id, client, name, description, isDefault, active, sla, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: "#/components/schemas/Ref" }
        name: { type: string, example: e-Office }
        description:
          type: string
          nullable: true
          description: Shown under the name in the portal's "Which system?".
          example: Letters, dispositions, archives
        isDefault:
          type: boolean
          description: Service requests from this client go to its default project.
        active:
          type: boolean
          description: Hidden projects keep their tickets but are left off the report form.
        sla: { $ref: "#/components/schemas/ProjectSla" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [clientId, name, isDefault, active]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        isDefault: { type: boolean }
        active: { type: boolean }

    ProjectUpdate:
      type: object
      required: [name, isDefault, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        isDefault: { type: boolean }
        active: { type: boolean }

    BusinessHours:
      type: object
      required: [timezone, weekdays, opens, closes, workingDayMinutes]
      properties:
        timezone: { type: string, example: Asia/Jakarta }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/Weekday" }
        opens: { type: string, example: "08:00" }
        closes: { type: string, example: "17:00" }
        workingDayMinutes:
          type: integer
          description: Length of one working day; converts "working days" to minutes.
          example: 540

    BusinessHoursInput:
      type: object
      required: [weekdays, opens, closes]
      properties:
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: "#/components/schemas/Weekday" }
        opens: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "08:00" }
        closes: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", example: "17:00" }

    Holiday:
      type: object
      required: [id, date, name]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        name: { type: string, example: Hari Lahir Pancasila }

    HolidayInput:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 200 }

    HolidayPreset:
      type: object
      required: [year, country, holidayCount, missingCount]
      properties:
        year: { type: integer }
        country: { type: string, example: ID }
        holidayCount: { type: integer }
        missingCount:
          type: integer
          description: Preset dates that have no holiday yet.

    HolidayPresetLoadResult:
      type: object
      required: [year, addedCount, skippedCount]
      properties:
        year: { type: integer }
        addedCount: { type: integer }
        skippedCount:
          type: integer
          description: Dates that already had a holiday.

    Requester:
      type: object
      required: [id, name, email, jobTitle, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hendra Gunawan }
        email: { type: string }
        jobTitle: { type: string, nullable: true, example: IT Officer }
        status: { $ref: "#/components/schemas/UserStatus" }

    RequesterInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, minLength: 3, maxLength: 254 }
        jobTitle: { type: string, nullable: true, maxLength: 200 }

    Assignee:
      type: object
      required: [id, name, role, jobTitle, openTicketCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Rina Pratiwi }
        role: { $ref: "#/components/schemas/Role" }
        jobTitle: { type: string, nullable: true, example: L2 }
        openTicketCount: { type: integer }

    System:
      type: object
      required: [id, name, description, sortOrder, active, ticketCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: e-Office }
        description: { type: string, nullable: true, example: "Letters, dispositions, archives" }
        sortOrder: { type: integer }
        active: { type: boolean, description: Shown on the report form. }
        ticketCount: { type: integer }

    SystemInput:
      type: object
      required: [name, sortOrder, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        active: { type: boolean }

    CatalogItem:
      type: object
      required: [id, name, description, deliveryMinutes, sortOrder, active, ticketCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: VPN / remote access }
        description: { type: string, nullable: true }
        deliveryMinutes:
          type: integer
          description: Working minutes.
          example: 1080
        sortOrder: { type: integer }
        active: { type: boolean, description: Shown on the report form. }
        ticketCount: { type: integer }

    CatalogItemInput:
      type: object
      required: [name, deliveryMinutes, sortOrder, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 300 }
        deliveryMinutes: { type: integer, minimum: 1, maximum: 525600 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        active: { type: boolean }

    IntakeSystem:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }

    IntakeCatalogItem:
      type: object
      required: [id, name, description, deliveryMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        deliveryMinutes: { type: integer }

    Intake:
      type: object
      required: [clientId, targets, businessHours, systems, catalogItems]
      properties:
        clientId: { type: string, format: uuid }
        targets:
          type: array
          description: The client's plan, P1 to P4.
          items: { $ref: "#/components/schemas/SlaTarget" }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
        systems:
          type: array
          items: { $ref: "#/components/schemas/IntakeSystem" }
        catalogItems:
          type: array
          items: { $ref: "#/components/schemas/IntakeCatalogItem" }

    AttachmentPolicy:
      type: object
      required: [maxBytes, maxPerMessage, extensions]
      properties:
        maxBytes: { type: integer, format: int64, example: 10485760 }
        maxPerMessage: { type: integer, example: 5 }
        extensions:
          type: array
          items: { type: string, example: .png }

    Attachment:
      type: object
      required: [id, filename, contentType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string, example: screenshot-login-error.png }
        contentType: { type: string, example: image/png }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    TicketType:
      type: string
      enum: [incident, request]

    TicketStatus:
      type: string
      enum: [new, assigned, in_progress, waiting_on_client, in_uat, resolved, closed]

    TicketChannel:
      type: string
      enum: [portal, phone, email, whatsapp, in_person]

    MessageVisibility:
      type: string
      description: "`internal` notes are never shown to requesters."
      enum: [public, internal]

    TicketAssigneeFilter:
      type: string
      enum: [me, unassigned]

    TicketProgressStep:
      type: string
      enum: [received, assigned, in_progress, ready_for_test, resolved]

    TicketProgressState:
      type: string
      enum: [done, current, upcoming, skipped]

    TicketActivityAction:
      type: string
      enum: [created, status_changed, assignee_changed, priority_changed, reply_added, note_added, first_responded]

    TicketStatusCause:
      type: string
      description: Why the system changed the status on its own.
      enum: [assignment, requester_reply]

    TicketSla:
      type: object
      required: [priority, firstResponseMinutes, resolutionMinutes, calendar, fromCatalog]
      description: The target for the current priority, from the plan the client had when the ticket was opened.
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        firstResponseMinutes: { type: integer }
        resolutionMinutes:
          type: integer
          description: Resolve time for incidents, delivery time for service requests.
        calendar: { $ref: "#/components/schemas/SlaCalendar" }
        fromCatalog:
          type: boolean
          description: resolutionMinutes is the catalogue item's delivery time.

    TicketProgress:
      type: object
      required: [step, state, at]
      properties:
        step: { $ref: "#/components/schemas/TicketProgressStep" }
        state: { $ref: "#/components/schemas/TicketProgressState" }
        at: { type: string, format: date-time, nullable: true }

    TicketSummary:
      type: object
      required: [id, key, type, status, priority, subject, client, requester, assignee, createdAt, updatedAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: HD-24871 }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string, example: e-Office login fails for all staff }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/Ref" }
        assignee:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    Ticket:
      type: object
      required: [id, key, type, status, priority, subject, client, requester, assignee, createdAt, updatedAt,
                 resolvedAt, channel, description, requesterJobTitle, system, catalogItem, createdBy,
                 loggedByStaff, attachments, sla, slaTargets, firstResponseAt, closedAt, progress, allowedStatuses]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: HD-24871 }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/Ref" }
        assignee:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        channel: { $ref: "#/components/schemas/TicketChannel" }
        description: { type: string }
        requesterJobTitle: { type: string, nullable: true }
        system:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        catalogItem:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        createdBy: { $ref: "#/components/schemas/Ref" }
        loggedByStaff:
          type: boolean
          description: An agent logged the ticket on the requester's behalf.
        attachments:
          type: array
          description: Files on the description.
          items: { $ref: "#/components/schemas/Attachment" }
        sla: { $ref: "#/components/schemas/TicketSla" }
        slaTargets:
          type: array
          description: Every priority's target from the ticket's plan snapshot, P1 to P4.
          items: { $ref: "#/components/schemas/SlaTarget" }
        firstResponseAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        progress:
          type: array
          description: The requester's progress tracker, in order.
          items: { $ref: "#/components/schemas/TicketProgress" }
        allowedStatuses:
          type: array
          description: Manual status changes open to the user; empty for requesters.
          items: { $ref: "#/components/schemas/TicketStatus" }

    TicketInput:
      type: object
      required: [type, priority, subject, description]
      properties:
        type: { $ref: "#/components/schemas/TicketType" }
        priority: { $ref: "#/components/schemas/Priority" }
        subject: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        systemId:
          type: string
          format: uuid
          description: Incidents only.
        catalogItemId:
          type: string
          format: uuid
          description: Service requests only.
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        clientId:
          type: string
          format: uuid
          description: Staff only.
        requesterId:
          type: string
          format: uuid
          description: Staff only; a requester of the client.
        channel:
          allOf: [{ $ref: "#/components/schemas/TicketChannel" }]
          description: Staff only; any channel except portal.
        assignToMe:
          type: boolean
          description: Staff only.

    TicketMessage:
      type: object
      required: [id, author, authorJobTitle, fromSupport, visibility, body, attachments, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Ref" }
        authorJobTitle: { type: string, nullable: true }
        fromSupport:
          type: boolean
          description: Written by vendor staff rather than the client.
        visibility: { $ref: "#/components/schemas/MessageVisibility" }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        createdAt: { type: string, format: date-time }

    TicketMessageInput:
      type: object
      required: [visibility, body]
      properties:
        visibility: { $ref: "#/components/schemas/MessageVisibility" }
        body: { type: string, minLength: 1, maxLength: 20000 }
        attachmentIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }

    TicketStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }

    TicketAssigneeInput:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: null unassigns.

    TicketPriorityInput:
      type: object
      required: [priority, reason]
      properties:
        priority: { $ref: "#/components/schemas/Priority" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    TicketActivity:
      type: object
      required: [id, at, actorName, action, from, to, reason, cause, channel]
      description: |
        One activity-log line. `from`/`to` hold statuses (status_changed), priorities
        (priority_changed) or assignee names (assignee_changed; null = unassigned).
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorName:
          type: string
          nullable: true
          description: null for the system.
        action: { $ref: "#/components/schemas/TicketActivityAction" }
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        cause:
          allOf: [{ $ref: "#/components/schemas/TicketStatusCause" }]
          nullable: true
        channel:
          allOf: [{ $ref: "#/components/schemas/TicketChannel" }]
          nullable: true
          description: Set on created.
