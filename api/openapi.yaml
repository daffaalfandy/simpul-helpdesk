        secret, and a commit whose message names a ticket key is linked to that ticket, with every
        branch it reaches. Commits never change a ticket.
      tags: [integrations]
      responses:
        "200":
          description: Repositories, newest problems first in each status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
